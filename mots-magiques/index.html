<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Mots Magiques ont déménagé</title>
<meta http-equiv="refresh" content="0; url=https://sanpero45.github.io/mots-magiques/">
<link rel="canonical" href="https://sanpero45.github.io/mots-magiques/">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eaf1fb; color: #1d2242;
         font-family: ui-rounded, "Nunito", "Trebuchet MS", system-ui, sans-serif; text-align: center; padding: 16px; }
  a { color: #3b4fe0; font-weight: 800; font-size: 1.2rem; }
</style>
</head>
<body>
  <div>
    <p style="font-size:3rem;margin:0">🦉</p>
    <p>Les Mots Magiques ont une nouvelle adresse :</p>
    <p><a href="https://sanpero45.github.io/mots-magiques/">sanpero45.github.io/mots-magiques</a></p>
  </div>
<script>
  // L'ancienne version gardait une copie pour jouer sans internet : on l'efface, puis on part vers la nouvelle adresse.
  (async () => {
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.filter(r => r.scope.includes('/cyber-academy/mots-magiques/')).map(r => r.unregister()));
      }
      if (window.caches) await Promise.all((await caches.keys()).filter(k => k.startsWith('mots-magiques')).map(k => caches.delete(k)));
    } catch (e) {}
    location.replace('https://sanpero45.github.io/mots-magiques/' + location.hash);
  })();
</script>
</body>
</html>
